services:
  api:
    build: .
    image: luxtransport:local
    container_name: luxtransport
    ports:
      - "8000:8000"
    # MODEL_PATH is gone: app/main.py loads models/forecast_model.pkl through
    # forecast.predict.load_bundle(), and the old value pointed at
    # forecast_model_2024.pkl, which no longer exists.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped
